<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Progress Tracker</title>
  <style>
    /* ── Tokens ─────────────────────────────────────────────── */
    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface-2:   #1e2530;
      --border:      #2d3748;
      --border-soft: #1e2a38;
      --text:        #e6edf3;
      --text-muted:  #8b949e;
      --amber:       #e6a817;
      --amber-dim:   #7a5510;
      --amber-glow:  rgba(230, 168, 23, 0.12);
      --green:       #3fb950;
      --red:         #f85149;
      --radius:      6px;
      --mono:        "Courier New", Courier, monospace;
      --sans:        system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    /* ── Layout ─────────────────────────────────────────────── */
    .app {
      max-width: 780px;
      margin: 0 auto;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .app-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
      margin-bottom: 2rem;
    }

    .app-header h1 {
      font-family: var(--mono);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .app-header h1 span {
      color: var(--amber);
    }

    .app-header p {
      margin-top: .3rem;
      font-size: .85rem;
      color: var(--text-muted);
    }

    /* ── Repo URL ────────────────────────────────────────────── */
    .repo-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      margin-bottom: 1.75rem;
    }

    .field-label {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin-bottom: .5rem;
    }

    .repo-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: .9rem;
      padding: .55rem .75rem;
      outline: none;
      transition: border-color .15s;
    }

    .repo-input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px var(--amber-glow);
    }

    .repo-input::placeholder { color: var(--text-muted); }

    /* ── Tasks ───────────────────────────────────────────────── */
    .tasks-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .tasks-header h2 {
      font-family: var(--mono);
      font-size: .95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
    }

    .progress-pill {
      font-family: var(--mono);
      font-size: .78rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: .2rem .7rem;
      color: var(--text-muted);
    }

    .progress-pill span { color: var(--amber); font-weight: 700; }

    /* Progress bar */
    .progress-bar-wrap {
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--amber);
      border-radius: 99px;
      transition: width .3s ease;
    }

    /* Task card */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      transition: border-left-color .2s, background .2s, box-shadow .2s;
    }

    .task-card.done {
      border-left-color: var(--amber);
      background: linear-gradient(90deg, var(--amber-glow) 0%, var(--surface) 60%);
    }

    .task-card.done .task-title {
      color: var(--text-muted);
      text-decoration: line-through;
      text-decoration-color: var(--amber-dim);
    }

    .task-row {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
    }

    /* Custom checkbox */
    .task-checkbox-wrap {
      position: relative;
      flex-shrink: 0;
      margin-top: .18rem;
    }

    .task-checkbox-wrap input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 1.1rem;
      height: 1.1rem;
      cursor: pointer;
      margin: 0;
    }

    .task-checkbox-wrap input[type="checkbox"]:focus-visible + .custom-check {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    .custom-check {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.1rem;
      height: 1.1rem;
      border: 1.5px solid var(--border);
      border-radius: 3px;
      background: var(--bg);
      pointer-events: none;
      transition: border-color .15s, background .15s;
    }

    .task-checkbox-wrap input[type="checkbox"]:checked + .custom-check {
      background: var(--amber);
      border-color: var(--amber);
    }

    .custom-check svg {
      display: none;
    }

    .task-checkbox-wrap input[type="checkbox"]:checked + .custom-check svg {
      display: block;
    }

    .task-title-wrap {
      flex: 1;
    }

    .task-id {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--amber);
      letter-spacing: .04em;
      display: block;
      margin-bottom: .1rem;
    }

    .task-title {
      font-size: .95rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: color .15s;
      line-height: 1.4;
    }

    .task-notes {
      margin-top: .75rem;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-soft);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--sans);
      font-size: .85rem;
      line-height: 1.6;
      padding: .55rem .7rem;
      resize: vertical;
      min-height: 64px;
      outline: none;
      transition: border-color .15s;
    }

    .task-notes:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 2px var(--amber-glow);
    }

    .task-notes::placeholder { color: var(--text-muted); }

    /* ── Action bar ──────────────────────────────────────────── */
    .action-bar {
      display: flex;
      gap: .75rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      font-family: var(--sans);
      font-size: .88rem;
      font-weight: 600;
      padding: .6rem 1.2rem;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      outline: none;
      letter-spacing: .01em;
    }

    .btn:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    .btn:active { transform: scale(.97); }

    .btn-primary {
      background: var(--amber);
      color: #0d1117;
    }

    .btn-primary:hover { opacity: .88; }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--surface); }

    /* ── Toast ───────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .88rem;
      padding: .65rem 1.2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 100;
      max-width: 90vw;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.toast-error { border-color: var(--red); color: var(--red); }
    #toast.toast-ok    { border-color: var(--green); color: var(--green); }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 520px) {
      body { padding: 1.25rem .75rem 3rem; }
      .action-bar { flex-direction: column; }
      .btn { justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app" role="main">

    <!-- Header -->
    <header class="app-header">
      <h1>// <span>progress</span>.tracker</h1>
      <p>Track tasks, capture notes, and export your progress as JSON.</p>
    </header>

    <!-- Repo URL -->
    <section class="repo-section" aria-labelledby="repo-label">
      <label class="field-label" id="repo-label" for="repoUrl">GitHub Repository URL</label>
      <input
        type="url"
        id="repoUrl"
        class="repo-input"
        placeholder="https://github.com/username/repo"
        aria-describedby="repo-label"
      />
    </section>

    <!-- Tasks -->
    <section aria-labelledby="tasks-heading">
      <div class="tasks-header">
        <h2 id="tasks-heading">Project Tasks</h2>
        <div class="progress-pill" aria-live="polite" aria-atomic="true">
          <span id="done-count">0</span> / <span id="total-count">12</span> done
        </div>
      </div>

      <div class="progress-bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0" aria-label="Overall task completion">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>

      <ol class="task-list" id="task-list" aria-label="Project task list"></ol>
    </section>

    <!-- Actions -->
    <div class="action-bar">
      <button class="btn btn-primary" id="btn-save" type="button">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 14V2h9l3 3v9H2zm7-12v4H5V2m0 8a2 2 0 1 0 4 0 2 2 0 0 0-4 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Save progress.json
      </button>
      <button class="btn btn-secondary" id="btn-load" type="button">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 1v9m0-9L5 4m3-3 3 3M1 11v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Load progress.json
      </button>
    </div>

    <!-- Hidden file input for load -->
    <input type="file" id="file-input" accept=".json,application/json" style="display:none" aria-hidden="true" tabindex="-1" />

  </main>

  <!-- Toast notification -->
  <div id="toast" role="status" aria-live="assertive" aria-atomic="true"></div>

  <script>
    /* ── Default task definitions ─────────────────────────────── */
    const DEFAULT_TASKS = [
      { title: "Setup",               completed: false, notes: "" },
      { title: "Model Topography",    completed: false, notes: "" },
      { title: "Deep Research Brief", completed: false, notes: "" },
      { title: "Tracker App",         completed: false, notes: "" },
      { title: "Data Analysis Memo",  completed: false, notes: "" },
      { title: "Visual Explainer",    completed: false, notes: "" },
      { title: "Information Pipeline",completed: false, notes: "" },
      { title: "Progress Artifacts",  completed: false, notes: "" },
      { title: "Ollama",              completed: false, notes: "" },
      { title: "Progress Artifacts",  completed: false, notes: "" },
      { title: "AI-Powered Build",    completed: false, notes: "" },
      { title: "HackTheBox",          completed: false, notes: "" },
    ];

    /* ── State ───────────────────────────────────────────────── */
    let state = {
      repoUrl: "",
      tasks: DEFAULT_TASKS.map(t => ({ ...t }))
    };

    /* ── DOM refs ────────────────────────────────────────────── */
    const repoInput     = document.getElementById("repoUrl");
    const taskList      = document.getElementById("task-list");
    const doneCount     = document.getElementById("done-count");
    const totalCount    = document.getElementById("total-count");
    const progressFill  = document.getElementById("progress-fill");
    const progressBar   = progressFill.parentElement;
    const btnSave       = document.getElementById("btn-save");
    const btnLoad       = document.getElementById("btn-load");
    const fileInput     = document.getElementById("file-input");
    const toast         = document.getElementById("toast");

    let toastTimer = null;

    /* ── Toast ───────────────────────────────────────────────── */
    function showToast(msg, type = "ok") {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.className = "show toast-" + type;
      toastTimer = setTimeout(() => { toast.className = ""; }, 3500);
    }

    /* ── Progress update ─────────────────────────────────────── */
    function updateProgress() {
      const done  = state.tasks.filter(t => t.completed).length;
      const total = state.tasks.length;
      const pct   = total > 0 ? (done / total) * 100 : 0;
      doneCount.textContent  = done;
      totalCount.textContent = total;
      progressFill.style.width = pct + "%";
      progressBar.setAttribute("aria-valuenow", done);
    }

    /* ── Render task list ────────────────────────────────────── */
    function renderTasks() {
      taskList.innerHTML = "";
      state.tasks.forEach((task, i) => {
        const num    = String(i + 1).padStart(2, "0");
        const cardId = "task-card-" + i;
        const cbId   = "task-cb-"   + i;
        const taId   = "task-ta-"   + i;

        const li = document.createElement("li");
        li.className = "task-card" + (task.completed ? " done" : "");
        li.id = cardId;

        li.innerHTML = `
          <div class="task-row">
            <label class="task-checkbox-wrap" for="${cbId}" title="Mark ${task.title} as complete">
              <input
                type="checkbox"
                id="${cbId}"
                ${task.completed ? "checked" : ""}
                aria-label="Mark '${task.title}' as ${task.completed ? "incomplete" : "complete"}"
              />
              <span class="custom-check" aria-hidden="true">
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                  <polyline points="1.5,5 4,7.5 8.5,2.5" stroke="#0d1117" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </label>
            <div class="task-title-wrap">
              <span class="task-id" aria-hidden="true">Project${num}</span>
              <label class="task-title" for="${cbId}">${escapeHtml(task.title)}</label>
            </div>
          </div>
          <textarea
            id="${taId}"
            class="task-notes"
            rows="3"
            placeholder="Add notes for ${escapeHtml(task.title)}…"
            aria-label="Notes for ${escapeHtml(task.title)}"
          >${escapeHtml(task.notes)}</textarea>
        `;

        // Checkbox change
        li.querySelector("input[type=checkbox]").addEventListener("change", e => {
          state.tasks[i].completed = e.target.checked;
          li.classList.toggle("done", e.target.checked);
          e.target.setAttribute("aria-label",
            `Mark '${task.title}' as ${e.target.checked ? "incomplete" : "complete"}`);
          updateProgress();
        });

        // Textarea input
        li.querySelector("textarea").addEventListener("input", e => {
          state.tasks[i].notes = e.target.value;
        });

        taskList.appendChild(li);
      });

      updateProgress();
    }

    /* ── Repo input sync ─────────────────────────────────────── */
    repoInput.addEventListener("input", () => {
      state.repoUrl = repoInput.value;
    });

    /* ── Save ────────────────────────────────────────────────── */
    btnSave.addEventListener("click", () => {
      const payload = {
        repoUrl: state.repoUrl,
        tasks: state.tasks.map(t => ({
          title:     t.title,
          completed: t.completed,
          notes:     t.notes
        }))
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href     = url;
      a.download = "progress.json";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);

      showToast("✓ progress.json saved", "ok");
    });

    /* ── Load ────────────────────────────────────────────────── */
    btnLoad.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      fileInput.value = ""; // reset so same file can be reloaded

      const reader = new FileReader();
      reader.onerror = () => showToast("Could not read file.", "error");
      reader.onload = e => {
        let parsed;
        try {
          parsed = JSON.parse(e.target.result);
        } catch {
          showToast("Invalid JSON file — could not parse.", "error");
          return;
        }

        const warnings = [];

        // Validate & extract repoUrl
        if (typeof parsed.repoUrl === "string") {
          state.repoUrl = parsed.repoUrl;
        } else {
          if ("repoUrl" in parsed) warnings.push("repoUrl was invalid; reset to empty.");
          state.repoUrl = "";
        }
        repoInput.value = state.repoUrl;

        // Validate & merge tasks array
        if (!Array.isArray(parsed.tasks)) {
          warnings.push("No valid tasks array found; keeping defaults.");
        } else {
          const incoming = parsed.tasks;
          state.tasks = DEFAULT_TASKS.map((def, i) => {
            const src = incoming[i];
            if (!src || typeof src !== "object") {
              warnings.push(`Task ${i + 1}: missing entry; using defaults.`);
              return { ...def };
            }
            return {
              title:     typeof src.title === "string" && src.title.trim() !== ""
                           ? src.title
                           : def.title,
              completed: typeof src.completed === "boolean" ? src.completed : false,
              notes:     typeof src.notes === "string" ? src.notes : ""
            };
          });
        }

        renderTasks();

        if (warnings.length > 0) {
          showToast("Loaded with warnings — some fields used safe defaults.", "error");
          console.warn("[progress-tracker] Load warnings:", warnings);
        } else {
          showToast("✓ progress.json loaded", "ok");
        }
      };
      reader.readAsText(file);
    });

    /* ── Utility ─────────────────────────────────────────────── */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /* ── Init ────────────────────────────────────────────────── */
    renderTasks();
  </script>
</body>
</html>
